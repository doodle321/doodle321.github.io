<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Dev By Ammar</title>
<meta name="description" content="The page you were looking for could not be found. Browse live project demos or get in touch.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<style>
  .lost{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative}
  .lost-code{font-family:var(--font-head);font-size:clamp(5rem,16vw,9rem);font-weight:800;line-height:1;background:linear-gradient(120deg,var(--accent),#f3c87e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lost h1{font-size:clamp(1.4rem,3.5vw,2rem);margin:14px 0 10px}
  .lost p{color:var(--muted);max-width:440px;margin:0 auto 30px}
  .lost-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .lost .icon-btn{margin:0 auto 26px;width:64px;height:64px;border-radius:18px;pointer-events:none}
  .lost .icon-btn svg{width:30px;height:30px;color:var(--accent)}
</style>
</head>
<body>

<div class="lost">
  <div>
    <span class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></span>
    <div class="lost-code">404</div>
    <h1>This page moved or never existed.</h1>
    <p>The link may be outdated or mistyped — but the good stuff is all still here.</p>
    <div class="lost-actions">
      <a class="btn btn-accent" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/#work">Browse projects</a>
      <a class="btn btn-ghost" href="/#contact">Get in touch</a>
    </div>
  </div>
</div>

</body>
</html>
